name: Publication Android

# Crée une « Release » GitHub avec l'APK (à télécharger et installer) et le
# fichier AAB (pour le Play Store) quand on pousse une étiquette de version :
#   git tag v0.4.0 && git push origin v0.4.0
# Sans les secrets de signature, l'APK est signé avec la clé de test : il
# s'installe, mais n'est pas accepté par le Play Store (voir docs/PUBLICATION.md).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: APK et AAB
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Clé de signature de publication (si configurée)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - name: Renommer les fichiers
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "lumiere-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "lumiere-${GITHUB_REF_NAME}.aab"
      - uses: softprops/action-gh-release@v2
        with:
          name: Lumière ${{ github.ref_name }}
          body: |
            Lumière — la Bible en jeux, pour les enfants de 4 à 12 ans.
            Gratuit, sans publicité, sans collecte de données, jouable hors ligne.

            - **lumiere-${{ github.ref_name }}.apk** : à installer directement sur un téléphone Android.
            - **lumiere-${{ github.ref_name }}.aab** : pour le Play Store.
          files: |
            app/lumiere-${{ github.ref_name }}.apk
            app/lumiere-${{ github.ref_name }}.aab
      - name: Effacer la clé
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
